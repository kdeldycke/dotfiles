---
name: 🔬 Tests
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tests.yaml
      - dotfiles/**
      - install.sh
      - macos-config.sh
      - packages.toml
      - pyproject.toml
  # No `pull_request:` trigger on purpose. A full install burns a macOS runner
  # for 30 to 50 minutes, and every automation PR (Renovate, `Format JSON`,
  # `Sync .gitignore`) used to fire one on top of the `main` push, tripling the
  # macOS concurrency this repository holds and starving every other project.
  # The install is validated on `main` after merge and monthly by the schedule
  # below; use `workflow_dispatch` to test a branch on demand.
  schedule:
    # Run tests monthly to catch regressions from dependency or environment changes.
    - cron: "17 9 1 * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[changelog] Release') }}

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal that tests/test_workflows.py holds
# equal to `[tool.repomatic] minimum-release-age`. Deliberate bypasses are
# per-package CLI flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  tests:
    name: Run full installation
    runs-on: macos-26
    # A full install runs 30 to 50 minutes, the spread coming from how much
    # `brew upgrade` and `softwareupdate` the runner image needs. Anything past
    # this is a hang, and the default 6-hour cap lets one stuck GUI app hold a
    # macOS runner for the whole window, starving every other repository.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fix GitHub worker
        # Runs before any brew command so the untap below silences all of them.
        # aws-cli is already installed by hand in GitHub action runners.
        # Remove it to avoid "brew install --formula awscli" error.
        #
        # The runner image also taps aws/tap for aws-sam-cli. Since Homebrew
        # added tap trust, every single brew invocation prints a 15-line
        # "not trusted" warning about it. Nothing here installs from that tap,
        # so drop it rather than granting whole-tap trust or setting
        # HOMEBREW_NO_REQUIRE_TAP_TRUST, which would disable the check outright.
        run: |
          rm /usr/local/bin/aws
          rm /usr/local/bin/aws_completer
          brew untap aws/tap
      - name: Install Zsh
        run: |
          brew install zsh
      - name: Force default shell
        # GitHub macOS images forces bash as default:
        # https://github.com/actions/virtual-environments/blob/0d93dd2/images/macos/provision/configuration/shell-change.sh#L3-L5
        run: |
          sudo chsh -s "$(brew --prefix zsh)/bin/zsh" root
          sudo chsh -s "$(brew --prefix zsh)/bin/zsh" "$USER"
      - name: Run install
        run: |
          zsh ./install.sh

---
name: 🧪 Audit defaults
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    # The scan only ever reads these three files, so anything else pushed to
    # `main` has nothing to audit.
    paths:
      - .github/workflows/audit-defaults.yaml
      - macos-config.sh
      - tools/audit_defaults.py
  # No `pull_request:` trigger, for the same reason install.yaml gives: macOS
  # runners bill at a multiple of Linux ones and this repository's automation
  # PRs would fire one on top of every `main` push.

permissions: {}

jobs:

  audit-defaults:
    name: Scan system binaries for defaults-key consumers
    runs-on: macos-26
    # The scan runs in about a minute. Anything beyond this is a runaway, and
    # the default 6-hour cap would burn a full runner-hour budget before dying.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit macos-config.sh keys
        run: python3 ./tools/audit_defaults.py --scan ./macos-config.sh

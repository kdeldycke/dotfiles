---
name: 🧪 Audit defaults
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    # The scan only ever reads these three files, so anything else pushed to
    # `main` has nothing to audit.
    paths:
      - .github/workflows/audit-defaults.yaml
      - macos-config.sh
      - tools/audit_defaults.py
  # No `pull_request:` trigger, for the same reason install.yaml gives: macOS
  # runners bill at a multiple of Linux ones and this repository's automation
  # PRs would fire one on top of every `main` push.

permissions: {}

concurrency:
  # Without this, two pushes to `main` in quick succession each hold a macOS
  # runner to completion. Cancellation is unconditional, unlike the guarded
  # expression install.yaml inherits from upstream: there is no release
  # machinery in this repository for a `[changelog] Release` commit to protect.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Supply-chain cooldown: no package published within the window can be resolved
# by any command in this workflow. Nothing here resolves a package today, since
# the scan runs on the runner's system Python with no dependencies, but the
# block sits at workflow level so it also covers any step added later. Both
# values mirror repomatic's `minimum-release-age` default of one week.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  audit-defaults:
    name: Scan system binaries for defaults-key consumers
    runs-on: macos-26
    # The scan runs in about a minute. Anything beyond this is a runaway, and
    # the default 6-hour cap would burn a full runner-hour budget before dying.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit macos-config.sh keys
        run: python3 ./tools/audit_defaults.py --scan ./macos-config.sh

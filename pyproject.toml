[tool.repomatic]
exclude = [
    "changelog",
    "workflows/changelog.yaml",
    "workflows/debug.yaml",
    "workflows/release.yaml",
    # There is no Python test matrix to run here, so this repository genuinely
    # has no upstream tests.yaml. Its own check is a full macOS install, which
    # lives unmanaged in workflows/install.yaml under a name repomatic does not
    # own. Excluding a workflow deletes it (`repomatic init --delete-excluded`
    # in the sync job), so this entry only stays safe as long as the install
    # job keeps its separate filename.
    "workflows/tests.yaml",
]
include = ["skills", "subagents"]
# Skills and subagents deploy here, into dotfiles/.agents/ (symlinked to
# ~/.claude/skills and ~/.claude/agents by install.sh), because this machine
# consumes them from home: every session starts from this laptop, and the
# shadowing probe of 2026-08-20 showed user-level copies win over project
# ones anyway, so repo-carried duplicates would only ever run on surfaces
# this fleet does not use. The downstream repos dropped their copies at the
# same time and keep only their own domain-specific skills and agents.
#
# The `agent` component left `include` on 2026-08-20 for the same reason. The
# instructions file dotfiles/.agents/AGENTS.md is symlinked to
# ~/.claude/CLAUDE.md and therefore loads on every project opened from this
# machine, so syncing per-repo copies of the same generic conventions merely
# duplicated them in every session, modulo the drift between sync schedules.
# The generic content moved into that file as hand-owned text instead, and
# each downstream repository's instructions file keeps only what is specific
# to it.
# gitignore.location is left at its default, the repository root, and the file
# there has to be a real one: git opens in-tree .gitignore, .gitattributes and
# .mailmap with O_NOFOLLOW, so a symlink is skipped with a "Too many levels of
# symbolic links" warning and its rules never apply. The $HOME-facing name is
# the symlink instead (dotfiles/.gitignore_global -> ../.gitignore), which the
# links stage of install.sh picks up and links to ~/.gitignore_global for
# core.excludesFile. Do not point location back into dotfiles/.
gitignore.extra-categories = [
    "archive",
    "archives",
    "backup",
    "bittorrent",
    "compressed",
    "compressedarchive",
    "compression",
    "database",
    "datarecovery",
    "executable",
    "games",
    "jupyternotebooks",
    "less",
    "libreoffice",
    "microsoftoffice",
]
# Everything past the gitignore.io block is regenerated from this string, so an
# entry added straight to .gitignore is dropped by the next sync. This
# replaces repomatic's default wholesale rather than extending it: the upstream
# entries have to be repeated here or they go away too.
gitignore.extra-content = '''
# Claude Code local files.
.claude/scheduled_tasks.lock
.claude/settings.local.json
**/.claude/.cc-writes/
'''
skills.location = "./dotfiles/.agents/skills/"
# Subagent definitions, distinct from `agent.location` above: that one names an
# instructions document, this one a directory of subagent .md files. They sit
# under different trees here because the skills moved to the agent-neutral
# .agents/ while the subagents are still a Claude Code layout.
subagents.location = "./dotfiles/.claude/agents/"

[tool.repomatic.workflow.paths]
"docs.yaml" = [
    ".github/workflows/docs.yaml",
    "pyproject.toml",
    "**/*.md",
]

[tool.ruff]
# Mirrors repomatic/data/ruff.toml. A `[tool.ruff]` section in pyproject.toml
# short-circuits `repomatic run ruff` at level 2 of its config chain (see
# repomatic.tool_runner.resolve_config), so the bundled defaults never load and
# every knob below has to be repeated here. Without `fix`, in particular, the
# autofix workflow's `ruff check --exit-zero` step annotates but never repairs.
preview = true
fix = true
# Unsafe fixes rewrite semantics, not just style, and the autofix workflow
# commits them unreviewed.
# See: https://docs.astral.sh/ruff/linter/#fix-safety
unsafe-fixes = false
show-fixes = true
# Report `ISC004` rather than `implicit-string-concatenation-in-collection-literal`.
# Preview mode otherwise prints human-readable rule names, but every knob below
# (and every CI annotation) speaks in codes, so the code is the token to paste
# into `lint.ignore` to silence what was just read.
# https://docs.astral.sh/ruff/settings/#output-prefer-rule-codes
output-prefer-rule-codes = true
# Enable reformatting of code snippets in docstrings.
# https://docs.astral.sh/ruff/formatter/#docstring-formatting
format.docstring-code-format = true
# PLW1514: `open` and friends called without an explicit `encoding` argument,
#   which falls back to the locale default and so reads differently depending
#   on where the script runs.
#   See: https://docs.astral.sh/ruff/rules/unspecified-encoding/
lint.extend-select = [ "PLW1514" ]
# D400: First line should end with a period.
#   Allows docstrings to end up with any punctuation, not just a period.
#   See: https://github.com/astral-sh/ruff/issues/1858#issuecomment-1382640623
# ERA001: Found commented-out code.
#   Do not remove commented code, as it might be used for documentation.
#   See: https://docs.astral.sh/ruff/rules/#eradicate-era
# LOG015: Root logger calls (logging.info(), etc.).
#   See: https://docs.astral.sh/ruff/rules/root-logger-call/
lint.ignore = [ "D400", "ERA001", "LOG015" ]
# Allow rules to add `from __future__ import annotations` in cases where
# this would simplify a fix or enable a new diagnostic.
# https://docs.astral.sh/ruff/settings/#lint_future-annotations
lint.future-annotations = true
lint.isort.combine-as-imports = true
# Broken symlink on CI: target only exists on the local macOS machine.
extend-exclude = [
    "dotfiles/Library/Application Support/SwiftBar/",
]

[tool.biome.formatter]
indentStyle = "space"
indentWidth = 2

[tool.gitleaks.allowlist]
description = "False positives"
commits = [
    # A simple Twitter URL.
    # https://github.com/kdeldycke/dotfiles/commit/76a09e4314b791077c7a0c95ccb1a55d7dbf5ab2
    "76a09e4314b791077c7a0c95ccb1a55d7dbf5ab2",
    # Service account credential for GCP that was properly anonymized.
    # https://github.com/kdeldycke/dotfiles/commit/a1e242d19d7d5cb0acf8ee81cfe98b21b6bdfb77
    "a1e242d19d7d5cb0acf8ee81cfe98b21b6bdfb77",
    # Dummy API_KEY="abcdef123456" example in BitBar plugin.
    # https://github.com/kdeldycke/dotfiles/commit/49d09fd0f65b7a7a6c382272fc6819f0ead2a76c
    "49d09fd0f65b7a7a6c382272fc6819f0ead2a76c",
]

[tool.lychee]
# https://lychee.cli.rs/guides/config/
# Since lychee 0.24.0 this section is read straight out of pyproject.toml, so
# no separate config file is involved.
#
# Two upstream lists exist and they differ, so name the one being tracked: this
# mirrors kdeldycke/repomatic's own `[tool.lychee]`, not the bundled
# `repomatic/data/lychee.toml` template that `repomatic init lychee` writes.
# Dropped from repomatic's own list: doi.org-to-Zenodo, npmjs.com,
# githubstatus.com, and the `file://` docs-fragment rule that only a Sphinx tree
# needs. Never adopted from the bundled template: sci-hub.st, ycombinator.com
# and x.com, which it carries for awesome-list repositories. No document here
# links to any of those hosts.
exclude = [
    # GitHub issue comment fragments are dynamically loaded and can't be verified.
    "^https://github.com/.+/issues/[0-9]+#issuecomment-.*$",
    # Release binary download URLs redirect to the GitHub CDN (objects.githubusercontent.com).
    "^https://github.com/.+/releases/.+/download/.*$",
    # Bitdefender returns 403 to bots.
    "bitdefender\\.com",
    # archive.ph rate-limits crawlers.
    "archive\\.ph",
    # VirusTotal analysis pages are a JS app that rate-limits bots, and the
    # binaries page links one per released binary.
    "^https://www\\.virustotal\\.com/gui/.*$",
    # star-history.com fragments are JS-rendered and invisible to lychee.
    "^https://star-history\\.com/.*$",
]

[tool.typos]
# Correct capitalization for proper nouns referenced in claude.md, plus "PATCHed"
# and "PNGs": typos cuts an all-caps run before its trailing lowercase letters,
# so "PNGs" is checked as "PN" + "Gs" and rewritten to "ONGs", and "PATCHed" as
# "PATC" + "Hed" and rewritten to "PATCHead". Only an identifier accept
# suppresses either, since the checker never sees the whole word. Any acronym
# carrying a lowercase suffix needs its own entry here.
default.extend-identifiers = { Github = "GitHub", IOS = "iOS", Javascript = "JavaScript", MacOS = "macOS", PATCHed = "PATCHed", PNGs = "PNGs", PyPi = "PyPI", Typescript = "TypeScript", automaticEmojiSubstitutionEnablediMessage = "automaticEmojiSubstitutionEnablediMessage", AirplayRecieverEnabled = "AirplayRecieverEnabled" }
# False positives: "astroid" is a Python AST library (not "asteroid"); "oject" appears when "pyproject.toml" is split across line breaks in CLI help output; "sur" is macOS 11 Big Sur and Homebrew's big_sur bottle tag (not "sure").
default.extend-words = { astroid = "astroid", oject = "oject", sur = "sur", Sur = "Sur" }
# Skip content between <!-- typos:off --> and <!-- typos:on --> markers.
default.extend-ignore-re = [ "(?s)<!-- typos:off -->.*?<!-- typos:on -->" ]
# Skip the content of SVG files. A terminal capture renders each run of
# same-styled characters as one <text> element, so a word cut at a run boundary
# leaves a fragment the checker reads as a misspelling. Correcting it in place
# adds a letter to a run of fixed width, while the next run still carries the
# rest of the word, so the picture gains a doubled letter. typos ships an "svg"
# file type, so no glob is needed here. Filenames stay checked.
type.svg.check-file = false
# Exclude terminal config.
files.extend-exclude = [
    "assets/Monokai Soda.terminal",
]

[tool.mypy]
# Warn about unused '[mypy-*]' config sections.
warn_unused_configs = true
# Warn about casts that do nothing.
warn_redundant_casts = true
# Warn about '# type: ignore' comments that are not needed.
warn_unused_ignores = true
# Warn about returning Any from functions with non-Any return type.
warn_return_any = true
# Warn about unreachable code.
warn_unreachable = true
# Use visually nicer output in error messages.
pretty = true

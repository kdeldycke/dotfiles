[tool.repomatic]
exclude = [
    "changelog",
    "codecov",
    "workflows/changelog.yaml",
    "workflows/debug.yaml",
    "workflows/release.yaml",
    # There is no Python test matrix to run here, so this repository genuinely
    # has no upstream tests.yaml. Its own check is a full macOS install, which
    # lives unmanaged in workflows/install.yaml under a name repomatic does not
    # own. Excluding a workflow deletes it (`repomatic init --delete-excluded`
    # in the sync job), so this entry only stays safe as long as the install
    # job keeps its separate filename.
    "workflows/tests.yaml",
]
include = ["agents", "skills"]
agents.location = "./dotfiles/.claude/agents/"
gitignore.location = "./dotfiles/.gitignore_global"
gitignore.extra-categories = [
    "archive",
    "archives",
    "backup",
    "bittorrent",
    "compressed",
    "compressedarchive",
    "compression",
    "database",
    "datarecovery",
    "executable",
    "games",
    "jupyternotebooks",
    "less",
    "libreoffice",
    "microsoftoffice",
]
# Everything past the gitignore.io block is regenerated from this string, so an
# entry added straight to .gitignore_global is dropped by the next sync. This
# replaces repomatic's default wholesale rather than extending it: the upstream
# entries have to be repeated here or they go away too.
gitignore.extra-content = '''
# Claude Code local files.
.claude/scheduled_tasks.lock
.claude/settings.local.json
**/.claude/.cc-writes/
'''
skills.location = "./dotfiles/.agents/skills/"

[tool.repomatic.workflow.paths]
"docs.yaml" = [
    ".github/workflows/docs.yaml",
    "pyproject.toml",
    "**/*.md",
]

[tool.ruff]
# Broken symlink on CI: target only exists on the local macOS machine.
extend-exclude = [
    "dotfiles/Library/Application Support/SwiftBar/",
]

[tool.biome.formatter]
indentStyle = "space"
indentWidth = 2

[tool.gitleaks.allowlist]
description = "False positives"
commits = [
    # A simple Twitter URL.
    # https://github.com/kdeldycke/dotfiles/commit/76a09e4314b791077c7a0c95ccb1a55d7dbf5ab2
    "76a09e4314b791077c7a0c95ccb1a55d7dbf5ab2",
    # Service account credential for GCP that was properly anonymized.
    # https://github.com/kdeldycke/dotfiles/commit/a1e242d19d7d5cb0acf8ee81cfe98b21b6bdfb77
    "a1e242d19d7d5cb0acf8ee81cfe98b21b6bdfb77",
    # Dummy API_KEY="abcdef123456" example in BitBar plugin.
    # https://github.com/kdeldycke/dotfiles/commit/49d09fd0f65b7a7a6c382272fc6819f0ead2a76c
    "49d09fd0f65b7a7a6c382272fc6819f0ead2a76c",
]

[tool.typos]
# Exclude terminal config.
files.extend-exclude = [
    "assets/Monokai Soda.terminal",
]

[tool.typos.default.extend-identifiers]
# Actual macOS preference key name (ends with "iMessage", not "Message").
automaticEmojiSubstitutionEnablediMessage = "automaticEmojiSubstitutionEnablediMessage"

[tool.typos.default.extend-words]
# macOS 11 codename, not a typo of "Sure".
Sur = "Sur"

[tool.repomatic]
exclude = [
    "changelog",
    "workflows/changelog.yaml",
    "workflows/release.yaml",
    # There is no Python test matrix to run here, so this repository genuinely
    # has no upstream tests.yaml. Its own check is a full macOS install, which
    # lives unmanaged in workflows/install.yaml under a name repomatic does not
    # own. Excluding a workflow deletes it (`repomatic init --delete-excluded`
    # in the sync job), so this entry only stays safe as long as the install
    # job keeps its separate filename.
    "workflows/tests.yaml",
]
include = ["skills", "subagents"]
# Skills and subagents deploy here, into dotfiles/.agents/ (symlinked to
# ~/.claude/skills and ~/.claude/agents by install.sh), because this machine
# consumes them from home: every session starts from this laptop, and the
# shadowing probe of 2026-08-20 showed user-level copies win over project
# ones anyway, so repo-carried duplicates would only ever run on surfaces
# this fleet does not use. The downstream repos dropped their copies at the
# same time and keep only their own domain-specific skills and agents.
#
# The instructions file is hand-owned, not synced: repomatic dropped its
# `agent` component and the `agent.location` key, so `include` cannot name it.
# dotfiles/.agents/global-instruction.md is symlinked to ~/.claude/CLAUDE.md
# and loads on every project opened from this machine, so a per-repo copy would
# only duplicate it. The generic conventions live there as hand-owned text, and
# each downstream repository's instructions file keeps what is specific to it.
# gitignore.location is left at its default, the repository root, and the file
# there has to be a real one: git opens in-tree .gitignore, .gitattributes and
# .mailmap with O_NOFOLLOW, so a symlink is skipped with a "Too many levels of
# symbolic links" warning and its rules never apply. The $HOME-facing name is
# the symlink instead (dotfiles/.gitignore_global -> ../.gitignore), which the
# links stage of install.sh picks up and links to ~/.gitignore_global for
# core.excludesFile. Do not point location back into dotfiles/.
gitignore.extra-categories = [
    "archive",
    "archives",
    "backup",
    "bittorrent",
    "compressed",
    "compressedarchive",
    "compression",
    "database",
    "datarecovery",
    "executable",
    "games",
    "jupyternotebooks",
    "less",
    "libreoffice",
    "microsoftoffice",
]
# Everything past the gitignore.io block is regenerated from this string, so an
# entry added straight to .gitignore is dropped by the next sync. This
# replaces repomatic's default wholesale rather than extending it: the upstream
# entries have to be repeated here or they go away too.
gitignore.extra-content = '''
# Claude Code local files.
.claude/scheduled_tasks.lock
.claude/settings.local.json
**/.claude/.cc-writes/

# Skills Claude Code downloads from the account into the user skills dir,
# which is symlinked here. Bucketed per org and user, and re-fetched on its
# own, so a deleted copy comes back. `.trash` and `.staging` are the sync's
# two other reserved names, siblings of `synced` rather than children.
**/.agents/skills/synced/
**/.agents/skills/.trash/
**/.agents/skills/.staging/

# Host keys of the local UTM guests, rewritten whenever a guest is rebuilt.
# The glob also covers the `.old` backup `ssh-keygen -R` leaves behind.
**/.ssh/known_hosts_utm*

# The virtualenv template ignores every folder named `scripts`, and each skill
# keeps its helper scripts in one.
!/dotfiles/.agents/skills/*/scripts/
'''
skills.location = "./dotfiles/.agents/skills/"
# Subagent definitions, distinct from `agent.location` above: that one names an
# instructions document, this one a directory of subagent .md files. They sit
# under different trees here because the skills moved to the agent-neutral
# .agents/ while the subagents are still a Claude Code layout.
subagents.location = "./dotfiles/.claude/agents/"

[tool.repomatic.lint-repo.declined]
mypy.overrides.'{ module = ["sphinx.*"], ignore_missing_imports = true, follow_imports = "skip" }' = "No Python file here imports Sphinx, so mypy reports the override as an unused section."

[tool.repomatic.workflow.paths]
"docs.yaml" = [
    ".github/workflows/docs.yaml",
    "pyproject.toml",
    "**/*.md",
]

[tool.biome.formatter]
indentStyle = "space"
indentWidth = 2

[tool.biome.files]
# The application that owns each file excluded below rewrites it in its own
# layout. That layout differs from Biome's: a one-item array on three lines, a
# space before each colon, no final newline. A formatted copy lasts until the
# next write, so `format-json` proposes the same rewrite on every run.
#
# Each pattern starts with `**/`. repomatic gives this table to Biome in a
# temporary config file, and a pattern anchored at the repository root matches
# nothing from there.
includes = [
    "**",
    "!**/dotfiles/.claude/settings.json",
    "!**/dotfiles/.pi/agent/models.json",
    "!**/dotfiles/.pi/agent/settings.json",
    "!**/dotfiles/Library/Application Support/Code/User/settings.json",
]

[tool.gitleaks.extend]
# Keep the rules built into gitleaks. repomatic writes this table to a
# temporary `.gitleaks.toml`, and a config file without this key replaces the
# built-in rules with its own. With an allowlist alone, that leaves no rule.
useDefault = true

[tool.gitleaks.allowlist]
description = "False positives"
commits = [
    # A simple Twitter URL.
    # https://github.com/kdeldycke/dotfiles/commit/76a09e4314b791077c7a0c95ccb1a55d7dbf5ab2
    "76a09e4314b791077c7a0c95ccb1a55d7dbf5ab2",
    # Service account credential for GCP that was properly anonymized.
    # https://github.com/kdeldycke/dotfiles/commit/a1e242d19d7d5cb0acf8ee81cfe98b21b6bdfb77
    "a1e242d19d7d5cb0acf8ee81cfe98b21b6bdfb77",
    # Dummy API_KEY="abcdef123456" example in BitBar plugin.
    # https://github.com/kdeldycke/dotfiles/commit/49d09fd0f65b7a7a6c382272fc6819f0ead2a76c
    "49d09fd0f65b7a7a6c382272fc6819f0ead2a76c",
]
# The dummy value the comment above quotes. A commit list cannot cover it: each
# commit that adds or moves that comment line adds the value again.
regexes = [
    "abcdef123456",
]

[tool.lychee]
# https://lychee.cli.rs/guides/config/
# Since lychee 0.24.0 this section is read straight out of pyproject.toml, so
# no separate config file is involved.
#
# Two upstream lists exist and they differ, so name the one being tracked: this
# mirrors kdeldycke/repomatic's own `[tool.lychee]`, not the bundled
# `repomatic/data/lychee.toml` template that `repomatic init lychee` writes.
# Dropped from repomatic's own list: doi.org-to-Zenodo, npmjs.com,
# githubstatus.com, and the `file://` docs-fragment rule that only a Sphinx tree
# needs. Never adopted from the bundled template: sci-hub.st, ycombinator.com
# and x.com, which it carries for awesome-list repositories. No document here
# links to any of those hosts.
exclude = [
    # GitHub issue comment fragments are dynamically loaded and can't be verified.
    "^https://github.com/.+/issues/[0-9]+#issuecomment-.*$",
    # Release binary download URLs redirect to the GitHub CDN (objects.githubusercontent.com).
    "^https://github.com/.+/releases/.+/download/.*$",
    # Bitdefender returns 403 to bots.
    "bitdefender\\.com",
    # archive.ph rate-limits crawlers.
    "archive\\.ph",
    # VirusTotal analysis pages are a JS app that rate-limits bots, and the
    # binaries page links one per released binary.
    "^https://www\\.virustotal\\.com/gui/.*$",
]

[tool.typos]
# Correct capitalization for proper nouns, plus "PATCHed"
# and "PNGs": typos cuts an all-caps run before its trailing lowercase letters,
# so "PNGs" is checked as "PN" + "Gs" and rewritten to "ONGs", and "PATCHed" as
# "PATC" + "Hed" and rewritten to "PATCHead". Only an identifier accept
# suppresses either, since the checker never sees the whole word. Any acronym
# carrying a lowercase suffix needs its own entry here.
default.extend-identifiers = { Github = "GitHub", IOS = "iOS", Javascript = "JavaScript", MacOS = "macOS", PATCHed = "PATCHed", PNGs = "PNGs", PyPi = "PyPI", Typescript = "TypeScript", automaticEmojiSubstitutionEnablediMessage = "automaticEmojiSubstitutionEnablediMessage", AirplayRecieverEnabled = "AirplayRecieverEnabled" }
# False positives: "astroid" is a Python AST library (not "asteroid"); "certifi" is the CA bundle package a dependency graph lists under requests (not "certify"); "oject" appears when "pyproject.toml" is split across line breaks in CLI help output; "sur" is macOS 11 Big Sur and Homebrew's big_sur bottle tag (not "sure").
default.extend-words = { astroid = "astroid", certifi = "certifi", oject = "oject", sur = "sur", Sur = "Sur" }
# Skip content between <!-- typos:off --> and <!-- typos:on --> markers.
default.extend-ignore-re = [ "(?s)<!-- typos:off -->.*?<!-- typos:on -->" ]
default.extend-ignore-identifiers-re = [
  # error: `alikes` should be `alike`, `likes`
  #     ╭▸ ./dotfiles/.agents/global-instruction.md:401:400
  #     │
  # 401 │ …Literal blank look-alikes flatten the same way: an nbsp, braille blank…
  #     ╰╴                    ━━━━━━
  # The second half of "look-alikes". typos checks each side of a hyphen alone.
  "^alikes$",
  # error: `mis` should be `miss`, `mist`
  #     ╭▸ ./dotfiles/.agents/global-instruction.md:399:38
  #     │
  # 399 │ - **A regex that stops at whitespace mis-parses paths on macOS.**…
  #     ╰╴                                     ━━━
  # The prefix of "mis-parses". typos checks each side of a hyphen alone.
  "^mis$",
  # error: `nativ` should be `native`
  #   ╭▸ ./dotfiles/.pi/agent/models.json:3:6
  #   │
  # 3 │     "nativ" : {
  #   ╰╴     ━━━━━
  # Nativ is the name of the local model server. It is also the provider key
  # in the pi config and part of the `pi-nativ` function in `.zshrc`, where a
  # correction breaks the lookup.
  "^[Nn]ativ$",
  # error: `Pn` should be `On`
  #     ╭▸ ./dotfiles/.zshrc:260:31
  #     │
  # 260 │ __tab_title_precmd() { print -Pn '\e]1;zsh — %~\a' }
  #     ╰╴                              ━━
  # Two flags of the zsh `print` builtin.
  "^Pn$",
  # error: `WHT` should be `WHAT`
  #    ╭▸ ./dotfiles/.agents/skills/rename-with-dates/SKILL.md:70:80
  #    │
  # 70 │ …(like `Gorenje WHT923E5XUK - Cooker hood manual`); vendor doc codes…
  #    ╰╴                ━━━
  # The model number of a cooker hood. typos reads its first letters as a word.
  "^WHT923E5XUK$",
]
# Check hidden files and directories too, which typos skips by default: the
# `.github/` workflows and the `.claude/` agents and skills live there.
files.ignore-hidden = false
# Hidden files bring in paths typos must never rewrite. `.git` holds the
# repository internals. `sync-gitignore` regenerates `.gitignore`, which also
# carries globs like `[Ii]nclude` that typos reads as a typo it cannot fix.
# `.mailmap` lists contributor names, where a fix renames a person.
files.extend-exclude = [
  ".git",
  ".gitignore",
  ".mailmap",
  # Terminal config.
  "assets/Monokai Soda.terminal",
  # Every key is an upstream package ID, not prose. `mpm restore` looks each
  # name up verbatim, so a spelling correction here drops the package on a
  # fresh machine. `mpm snapshot --update-version` never repairs the name.
  # The Homebrew cask `nativ` is the first name typos flagged.
  "packages.toml",
]
# Skip the content of SVG files. A terminal capture renders each run of
# same-styled characters as one <text> element, so a word cut at a run boundary
# leaves a fragment the checker reads as a misspelling. Correcting it in place
# adds a letter to a run of fixed width, while the next run still carries the
# rest of the word, so the picture gains a doubled letter. typos ships an "svg"
# file type, so no glob is needed here. Filenames stay checked.
type.svg.check-file = false

[tool.mypy]
# Type-check the interior of functions that carry no type annotation.
check_untyped_defs = true
# Warn about unused '[mypy-*]' config sections.
warn_unused_configs = true
# Warn about casts that do nothing.
warn_redundant_casts = true
# Warn about '# type: ignore' comments that are not needed.
warn_unused_ignores = true
# Warn about returning Any from functions with non-Any return type.
warn_return_any = true
# Warn about unreachable code.
warn_unreachable = true
# Use visually nicer output in error messages.
pretty = true

[[tool.mypy.overrides]]
# The scripts of the transcribe-recording skill import packages that their PEP 723
# block or the Python of Nativ provides, and that CI does not install.
ignore_missing_imports = true
module = [
    "extract_msg",
    "huggingface_hub",
    "mlx.*",
    "mlx_audio.*",
    "num2words",
    "numpy",
    "PIL.*",
    "pyannote.*",
    "pymupdf",
    "rapidfuzz.*",
    "torch",
    "wordfreq",
]

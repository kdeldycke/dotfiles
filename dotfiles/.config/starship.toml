"$schema" = 'https://starship.rs/config-schema.json'

format = """
$sudo\
$username\
[](fg:prev_bg bg:color_yellow)\
$directory\
([](fg:prev_bg bg:color_aqua)$git_branch$git_status$git_state)\
([](fg:prev_bg bg:color_blue)$python$package)\
([](fg:prev_bg bg:color_bg1)$git_metrics)\
[](fg:prev_bg)\
$fill\
[](fg:color_bg1)\
$cmd_duration\
$status\
$line_break\
$character"""

palette = 'gruvbox_dark'

# Claude Code status line, rendered by `starship statusline claude-code`. The built-in profile
# is `$claude_model$git_branch$claude_context$claude_cost`, with no separators and no directory.
# This one mirrors the block grammar of `format` above, so both rows read the same way: an
# identity block, the directory, the git state, the language, then a padded right edge.
#
# Separators are literal glyphs, not something a module emits, so every one is spelled out here.
# An empty module collapses its block to the two glyphs around it, the same as in `format`.
#
# `~/code/dotfiles/dotfiles/.claude/statusline.py` supplies the pieces starship cannot reach on
# its own: the session directory through `--path`, the terminal width for `$fill`, and the
# `CC_*` variables below.
[profiles]
claude-code = """
$claude_model\
[](fg:prev_bg bg:color_yellow)\
$directory\
([](fg:prev_bg bg:color_aqua)$git_branch$git_status$git_state)\
([](fg:prev_bg bg:color_blue)$python$package)\
([](fg:prev_bg bg:color_bg1)$git_metrics)\
[](fg:prev_bg)\
$fill\
[](fg:color_bg1)\
[ ](bg:color_bg1)\
${env_var.CC_WORKTREE}\
${env_var.CC_PR}\
${env_var.CC_FLAGS}\
${env_var.CC_RATE_OK}\
${env_var.CC_RATE_WARN}\
${env_var.CC_RATE_CRIT}\
$claude_context\
$claude_cost"""

# pi renders this one, through `.pi/agent/extensions/starship-row.ts`, which replaces pi's
# built-in footer. Same block grammar as the two above; the right-hand block carries what pi's
# own footer showed and starship has no module for. `PI_*` variables are set by that extension,
# never by `statusline.py`, so they stay empty in the Claude Code row.
pi = """
$claude_model\
[](fg:prev_bg bg:color_yellow)\
$directory\
([](fg:prev_bg bg:color_aqua)$git_branch$git_status$git_state)\
([](fg:prev_bg bg:color_blue)$python$package)\
([](fg:prev_bg bg:color_bg1)$git_metrics)\
[](fg:prev_bg)\
$fill\
[](fg:color_bg1)\
[ ](bg:color_bg1)\
${env_var.CC_SESSION}\
${env_var.CC_WORKTREE}\
${env_var.CC_PR}\
${env_var.CC_FLAGS}\
${env_var.PI_TOKENS}\
${env_var.PI_CACHE}\
$claude_context\
${env_var.PI_CTXWINDOW}\
$claude_cost\
${env_var.PI_SUB}"""

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[sudo]
disabled = false
symbol = ' '
style = 'bg:color_red fg:color_fg0'
format = '[ $symbol ]($style)[](fg:prev_bg bg:color_orange)'

[username]
show_always = true
style_user = "fg:color_fg0"
style_root = "fg:color_fg0"
format = '[  $user ]($style bg:color_orange)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)[$read_only]($read_only_style)"
fish_style_pwd_dir_length = 1
truncate_to_repo = false

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

# Without this the default "bold yellow" prints on the terminal background, tearing a hole in
# the aqua block mid-rebase.
[git_state]
style = "bg:color_aqua"
format = '[[\($state( $progress_current/$progress_total)\) ](fg:color_red bg:color_aqua)]($style)'

# Working-tree lines against HEAD, which is what a session has changed on disk. starship ships
# this module disabled. `claude_cost` counts the same thing per session, as $lines_added and
# $lines_removed, if that reading is ever wanted instead.
[git_metrics]
disabled = false
added_style = "fg:color_green bg:color_bg1"
deleted_style = "fg:color_red bg:color_bg1"
format = '([ +$added]($added_style))([ -$deleted]($deleted_style))[ ](bg:color_bg1)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version)( $virtualenv) ](fg:color_fg0 bg:color_blue)]($style)'
generic_venv_names = ['.venv', 'venv']

[package]
format = '[$symbol$version](fg:color_fg0 bg:color_blue)'

[cmd_duration]
style = "bg:color_bg1"
format = '[[  $duration ](fg:color_fg0 bg:color_bg1)]($style)'
min_time = 50
show_milliseconds = true

[status]
disabled = false
symbol = "\\(╯°□°）╯︵ ┻━┻ "
style = "bg:color_red fg:color_fg0"
format = "[](bg:prev_bg fg:color_red)[$status $symbol]($style)"

# Explicit colour, not `fg:prev_fg`. The segment before the fill is the closing cap, which takes
# the colour of whichever block ended the run, and the conditional groups above mean that block
# varies: the dark tail in a repo, the yellow directory outside one. Inheriting it painted the
# rule yellow whenever git, python and the metrics were all absent. `color_bg1` also matches the
# block the fill runs into on the right.
[fill]
symbol = '─'
style = 'fg:color_bg1'

###############################################################################
# Claude Code status line
#
# Every module below renders only inside the `claude-code` profile, so their styling is free to
# assume the blocks that profile draws. The `display` lists replace starship's defaults, whose
# first entry is `hidden = true`: out of the box the gauge appears only past 30% and the cost
# only past $1.00, which is most of a session spent showing nothing.
###############################################################################

# Leads the row the way `username` leads the shell prompt, in the same orange. The aliases keep
# the block short: an unaliased name renders in full, so a new model degrades to something long
# rather than to nothing. Reasoning effort would belong here as $effort, but starship 1.26.0
# does not parse it: `statusline.py` reports it through CC_FLAGS instead.
[claude_model]
# `nf-md-robot`, not starship's default `🤖`. The emoji is East Asian Wide, so the terminal
# reserves two cells while the font paints about one and a half, and that slack read as a stray
# space beside the literal one. This glyph is one cell painted full, verified in
# SauceCodeProNerdFont at advance 600, the same as `M` and as the powerline separators. Being
# single width it takes its trailing space back, exactly like `` in `username`.
symbol = "󰚩 "
style = "fg:color_fg0 bg:color_orange"
format = '[ $symbol$model ]($style)'
model_aliases = { "Opus 5 (1M context)" = "Opus 5 1M", "Sonnet 5 (1M context)" = "Sonnet 5 1M" }

# Not in the profile: the session name is already in the terminal tab title, set by
# `.claude/hooks/session-title.py`, and in Claude Code's own badge above the input box. A third
# copy costs 20 columns. Add `${env_var.CC_SESSION}` back to the profile to restore it.
[env_var.CC_SESSION]
variable = "CC_SESSION"
format = '[$env_value ](dimmed fg:color_fg0 bg:color_bg1)'

[claude_context]
format = '[$gauge $percentage ]($style)'
display = [
  { threshold = 0, style = "bold green bg:color_bg1" },
  { threshold = 60, style = "bold yellow bg:color_bg1" },
  { threshold = 80, style = "bold red bg:color_bg1" },
]

[claude_cost]
format = '[$symbol\$$cost ]($style)'
display = [
  { threshold = 0, style = "bold green bg:color_bg1" },
  { threshold = 1, style = "bold yellow bg:color_bg1" },
  { threshold = 5, style = "bold red bg:color_bg1" },
]

# Fields with no starship module, exported by `statusline.py` from the session JSON. Each one
# hides itself when its variable is unset, which is what an absent field leaves behind.
[env_var.CC_WORKTREE]
variable = "CC_WORKTREE"
format = '[$env_value ](bold purple bg:color_bg1)'

[env_var.CC_PR]
variable = "CC_PR"
format = '[ $env_value ](bold green bg:color_bg1)'

# Reasoning level: Claude Code's effort, pi's thinking level. Same slot, same meaning.
[env_var.CC_FLAGS]
variable = "CC_FLAGS"
format = '[󰧑 $env_value ](bold cyan bg:color_bg1)'

# `` is `fa-hourglass`, the glyph `cmd_duration` already uses; `⏳` is absent from the font.
# One tier per severity, because `env_var` carries a single style and cannot colour by threshold
# the way `claude_context` does. `statusline.py` sets exactly one of the three.
[env_var.CC_RATE_OK]
variable = "CC_RATE_OK"
format = '[ $env_value ](bold green bg:color_bg1)'

[env_var.CC_RATE_WARN]
variable = "CC_RATE_WARN"
format = '[ $env_value ](bold yellow bg:color_bg1)'

[env_var.CC_RATE_CRIT]
variable = "CC_RATE_CRIT"
format = '[ $env_value ](bold red bg:color_bg1)'

###############################################################################
# pi footer only
#
# Values pi's built-in footer printed that no starship module reproduces. The extension formats
# each one the way pi did, so replacing the footer loses nothing.
###############################################################################

# Cumulative session tokens: input, output, cache read and cache write. starship exposes totals
# for input and output through `claude_context`, but the cache figures only for the last call,
# where pi reported them for the whole session. One preformatted string is simpler than fighting
# that mismatch, and it keeps pi's own k/M rounding.
[env_var.PI_TOKENS]
variable = "PI_TOKENS"
format = '[$env_value ](fg:color_fg0 bg:color_bg1)'

# Cache hit rate of the most recent call. starship holds the inputs but cannot divide them.
[env_var.PI_CACHE]
variable = "PI_CACHE"
format = '[$env_value ](bold green bg:color_bg1)'

# Context window size. `claude_context` renders the percentage and the gauge but never the window
# it is a percentage of. A trailing `?` means the size is known and the percentage is not, which
# happens between a compaction and the next response: the gauge reads empty there rather than
# unknown, which is the one thing this row states loosely. pi's `(auto)` auto-compaction marker is
# absent because `ExtensionContext` does not expose that flag at all.
[env_var.PI_CTXWINDOW]
variable = "PI_CTXWINDOW"
format = '[$env_value ](dimmed fg:color_fg0 bg:color_bg1)'

# Marks a cost as covered by a subscription rather than billed per token. Only pi's hardcoded
# `kimi-coding` provider sets it: the general test is `ModelRuntime.isUsingSubscription()`, and an
# extension is handed `modelRegistry` instead, whose `AuthStatus` never names a subscription.
[env_var.PI_SUB]
variable = "PI_SUB"
format = '[$env_value ](dimmed fg:color_fg0 bg:color_bg1)'

